name: Weekly Portfolio Analysis

on:
  schedule:
    - cron: '0 2 * * 1'   # Monday 09:00 Bangkok (UTC+7)
  workflow_dispatch:        # allow manual run from GitHub UI

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run portfolio analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/analyze.py

      - name: Commit updated portfolio
        run: |
          git config user.name  "MIND-X Bot"
          git config user.email "mindx-bot@users.noreply.github.com"
          git add portfolio.json
          git diff --staged --quiet || git commit -m "📈 Weekly portfolio update $(date +'%Y-%m-%d')"
          git push
